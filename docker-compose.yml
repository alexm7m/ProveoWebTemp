services:
  db:
    image: mysql:8.0
    container_name: proveo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Inicializacion de MySQL en volumenes nuevos (orden alfabetico):
      # 01 tablas del backend (users/provider_profiles)
      # 02 esquema de las tablas migradas
      # 03 datos migrados
      # 04 funcion de busqueda por radio
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./backend/migrations/data.sql:/docker-entrypoint-initdb.d/03_data.sql
      - ./backend/migrations/buscar_proveedores_cercanos.sql:/docker-entrypoint-initdb.d/04_buscar_proveedores_cercanos.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: proveo_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  db_data:
